# ─── Requires nginx ingress controller installed ──────────────
# Install with:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
#
# Then get the NodePort assigned to port 80:
#   kubectl get svc -n ingress-nginx ingress-nginx-controller
# Access via:  http://<node-ip>:<nodeport>
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stratedge
  namespace: stratedge
  labels:
    app: stratedge
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Allow large responses from batch backtest
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  rules:
    # IP-based access (no hostname needed)
    # If you later add a domain, replace the empty host block:
    #   host: stratedge.yourdomain.com
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stratedge
                port:
                  number: 80
